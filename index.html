<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isochrones & Commerces — Gares de Paris</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --ink:        #1c1a17;
      --paper:      #faf7f2;
      --line:       #e3ddd2;
      --red:        #c8202f;
      --accent:     #2f5d50;
      --accent-soft:#e4ede9;
      --muted:      #7a7268;
      --bakery:     #b3792c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ── Header ── */
    header {
      background: var(--ink);
      color: var(--paper);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    label {
      font-size: 0.85rem;
      color: var(--line);
    }

    select {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--ink);
      font-size: 0.9rem;
      cursor: pointer;
    }

    #status {
      margin-left: auto;
      font-size: 0.78rem;
      color: var(--muted);
      max-width: 320px;
      text-align: right;
    }

    #status.err   { color: var(--red); }
    #status.warn  { color: var(--bakery); }
    #status.ok    { color: #6aaa7c; }

    /* ── Map ── */
    #map {
      flex: 1;
      min-height: 0;
    }

    /* Leaflet control overrides */
    .leaflet-control-attribution {
      font-size: 0.7rem;
    }

    /* ── Legend panel ── */
    .legend {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.78rem;
      line-height: 1.8;
      box-shadow: 0 2px 8px rgba(28,26,23,0.12);
    }

    .legend h3 {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1.5px solid rgba(0,0,0,0.15);
    }

    /* Isochrone swatches — approximate opacity fills */
    .swatch-300 { background: rgba(47, 93, 80, 0.55); }
    .swatch-600 { background: rgba(47, 93, 80, 0.35); }
    .swatch-900 { background: rgba(47, 93, 80, 0.15); }

    .swatch-bakery  { background: var(--bakery); }
    .swatch-other   { background: var(--accent); }
  </style>
</head>
<body>

<header>
  <h1>Isochrones & Commerces — Gares de Paris</h1>

  <div class="controls">
    <label for="station-select">Gare :</label>
    <select id="station-select">
      <option value="">— Chargement… —</option>
    </select>
  </div>

  <span id="status" class="ok">Chargement de l'index des gares…</span>
</header>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
'use strict';

/* ─────────────────────────────────────────
   Station data cache (slug → station JSON)
   ───────────────────────────────────────── */
const stationCache = {};

/* ─────────────────────────────────────────
   Map initialisation
   ───────────────────────────────────────── */
const map = L.map('map', { zoomControl: true }).setView([48.8566, 2.3522], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19,
}).addTo(map);

/* ─────────────────────────────────────────
   Layer groups
   ───────────────────────────────────────── */
let isochroneLayer = L.layerGroup().addTo(map);
let shopLayer      = L.layerGroup().addTo(map);

/* ─────────────────────────────────────────
   Helpers
   ───────────────────────────────────────── */

/**
 * Colour for a GeoJSON isochrone feature.
 * Uses feature.properties.group_index (0, 1, 2) for 300/600/900 s ranges.
 */
function isochroneColor(groupIndex) {
  // accent #2f5d50 with varying opacity baked in via style function below
  const opacities = [0.55, 0.35, 0.15];
  return `rgba(47, 93, 80, ${opacities[groupIndex ?? 0]})`;
}

function isochroneStyle(feature) {
  return {
    color: '#2f5d50',
    weight: 1.5,
    opacity: 1,
    fillColor: '#2f5d50',
    fillOpacity: (feature.properties?.group_index === 0) ? 0.55
                 : (feature.properties?.group_index === 1) ? 0.35
                 : 0.15,
  };
}

/** Render shop markers onto shopLayer. */
function renderShops(shopData) {
  shopLayer.clearLayers();

  const elements = shopData?.elements ?? [];
  if (!elements.length) return;

  const stationIcon = L.icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/markers/marker-icon-violet.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
  });

  elements.forEach(node => {
    const tags = node.tags ?? {};
    const name = tags.name ?? tags.shop ?? 'Commerce';
    const shop = tags.shop ?? '';

    const color = (shop === 'bakery') ? '#b3792c' : '#2f5d50';

    const icon = L.divIcon({
      html: `<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
               <circle cx="9" cy="9" r="7" fill="${color}" stroke="white" stroke-width="1.5"/>
             </svg>`,
      iconSize: [18, 18],
      iconAnchor: [9, 9],
      popupAnchor: [0, -9],
      className: '',
    });

    const popup = `<b>${name}</b><br/><small>${shop}</small>`;
    L.marker([node.lat, node.lon], { icon })
      .bindPopup(popup)
      .addTo(shopLayer);
  });
}

/** Render isochrone GeoJSON onto isochroneLayer. */
function renderIsochrones(isochronesData) {
  isochroneLayer.clearLayers();

  const fc = isochronesData?.features;
  if (!fc || !fc.length) return;

  fc.forEach(feature => {
    // ORS-style group_index in properties
    const groupIndex = feature.properties?.group_index ?? 0;
    feature.properties = feature.properties || {};
    feature.properties.group_index = groupIndex;

    L.geoJSON(feature, { style: isochroneStyle }).addTo(isochroneLayer);
  });
}

/** Update status bar. */
function setStatus(msg, cls = 'ok') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls;
}

/** Format a French-readable timestamp. */
function fmtDate(isoStr) {
  if (!isoStr) return 'inconnu';
  const d = new Date(isoStr);
  return d.toLocaleString('fr-FR', {
    day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });
}

/* ─────────────────────────────────────────
   Station loading
   ───────────────────────────────────────── */
async function loadStation(slug) {
  if (stationCache[slug]) {
    applyStation(stationCache[slug]);
    return;
  }

  setStatus('Chargement des données…', 'ok');
  try {
    const res = await fetch(`data/stations/${slug}.json`);
    if (!res.ok) throw new Error(`HTTP ${res.ok}`);
    const data = await res.json();
    stationCache[slug] = data;
    applyStation(data);
  } catch (err) {
    setStatus('Erreur de chargement des données de la gare.', 'err');
    console.error('loadStation error:', err);
  }
}

function applyStation(data) {
  const stationInfo = data?.station ?? {};

  // Isochrones
  renderIsochrones(data?.isochrones ?? null);

  // Shops
  renderShops(data?.shops ?? null);

  // Station marker
  if (stationInfo.lat && stationInfo.lng) {
    const marker = L.marker([stationInfo.lat, stationInfo.lng], {
      title: stationInfo.name,
    }).bindPopup(`<b>${stationInfo.name}</b>`);
    marker.addTo(map);
    map.setView([stationInfo.lat, stationInfo.lng], 14);
  }

  // Status line
  const fetchedAt = fmtDate(data?.fetchedAt ?? null);
  const shopCount = data?.shops?.elements?.length ?? 0;
  let msg = `Mis à jour : ${fetchedAt} — ${shopCount} commerce${shopCount !== 1 ? 's' : ''}`;
  const cls = data?.staleDataWarning ? 'warn' : 'ok';
  if (data?.staleDataWarning) msg += ' (certaines données peuvent être anciennes)';
  setStatus(msg, cls);
}

/* ─────────────────────────────────────────
   Load station index on page load
   ───────────────────────────────────────── */
(async function init() {
  try {
    const res = await fetch('data/stations-index.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const index = await res.json();

    const select = document.getElementById('station-select');
    select.innerHTML = '<option value="">— Choisir une gare —</option>';

    (index.stations ?? []).forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.slug;
      opt.textContent = s.name;
      select.appendChild(opt);
    });

    if (index.staleDataWarning) {
      setStatus('Attention : certaines données datent de la dernière mise à jour réussie.', 'warn');
    } else {
      setStatus(`Index prêt — ${(index.stations ?? []).length} gare(s).`, 'ok');
    }

    select.addEventListener('change', () => {
      if (select.value) loadStation(select.value);
    });

    // Auto-load first station if index has only one entry
    if ((index.stations ?? []).length === 1) {
      select.value = index.stations[0].slug;
      loadStation(index.stations[0].slug);
    }

  } catch (err) {
    setStatus("Erreur : impossible de charger l'index des gares.", 'err');
    console.error('Index load error:', err);
  }
})();

/* ─────────────────────────────────────────
   Legend
   ───────────────────────────────────────── */
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <h3>Légende</h3>
    <div class="legend-item"><div class="swatch swatch-300"></div>5 min à pied (300 s)</div>
    <div class="legend-item"><div class="swatch swatch-600"></div>10 min à pied (600 s)</div>
    <div class="legend-item"><div class="swatch swatch-900"></div>15 min à pied (900 s)</div>
    <div class="legend-item"><div class="swatch swatch-bakery"></div>Boulangerie</div>
    <div class="legend-item"><div class="swatch swatch-other"></div>Autre commerce</div>
  `;
  return div;
};
legend.addTo(map);
</script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5"}' crossorigin="anonymous"></script>
</body>
</html>
